[project]
name = "diver"
version = "0.1.0"
description = "DIVER anonymous reproduction package"
requires-python = ">=3.10,<3.11"
dependencies = [
    "graphrag==2.7.2",
    "openai==2.53.0",
    "python-dotenv",
    "networkx==3.4.2",
    "pandas==2.3.3",
    "pyyaml",
    "numpy==1.26.4",
    "lancedb==0.36.0",
    "pyarrow==25.0.0",
]

[project.scripts]
diver = "extraction.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/extraction", "src/evaluation"]

[tool.uv]
package = true
